<text x="776" y="237" font-family="Arial, sans-serif" font-size="15" fill="#246ead" font-weight="700">WHAT THE SIGNATURE CARRIES</text>
<rect x="776" y="269" width="336" height="129" rx="10" fill="#eaf4fc" stroke="#a9cde8" />
<text x="798" y="300" font-family="Arial, sans-serif" font-size="19" fill="#234c6c" font-weight="700">One bit per level</text>
<text x="798" y="329" font-family="Arial, sans-serif" font-size="15" fill="#35546b">The low 160 bits of</text>
<text x="798" y="352" font-family="Arial, sans-serif" font-size="14" fill="#245f99" font-weight="700">H(5, zeros, message, randomizer)</text>
<text x="798" y="377" font-family="Arial, sans-serif" font-size="15" fill="#35546b">choose the left or right leaf.</text>
<path d="M776 423H1112" stroke="#d2dfeb" />
<text x="776" y="453" font-family="Arial, sans-serif" font-size="19" fill="#234c6c" font-weight="700">159 upper trees</text>
<text x="776" y="481" font-family="Arial, sans-serif" font-size="15" fill="#35546b">46 WOTS values sign the root below.</text>
<text x="776" y="507" font-family="Arial, sans-serif" font-size="15" fill="#35546b">Hash their chain endpoints to get</text>
<text x="776" y="533" font-family="Arial, sans-serif" font-size="15" fill="#35546b">the chosen leaf; add its sibling</text>
<text x="776" y="559" font-family="Arial, sans-serif" font-size="15" fill="#35546b">to obtain this tree’s root.</text>
<text x="776" y="596" font-family="Arial, sans-serif" font-size="17" fill="#2b70a6" font-weight="700">752 B per upper tree</text>
<path d="M776 618H1112" stroke="#d2dfeb" />
<text x="776" y="648" font-family="Arial, sans-serif" font-size="19" fill="#234c6c" font-weight="700">Bottom tree</text>
<text x="776" y="678" font-family="Arial, sans-serif" font-size="15" fill="#35546b">Reveal one 16 B secret preimage;</text>
<text x="776" y="704" font-family="Arial, sans-serif" font-size="15" fill="#35546b">hash it and combine the 16 B sibling.</text>
<text x="776" y="741" font-family="Arial, sans-serif" font-size="17" fill="#2b70a6" font-weight="700">32 B bottom proof</text>
<path d="M776 766H1112" stroke="#d2dfeb" />
<text x="776" y="799" font-family="Arial, sans-serif" font-size="19" fill="#234c6c" font-weight="700">Check</text>
<text x="776" y="827" font-family="Arial, sans-serif" font-size="15" fill="#35546b">The last root must equal the public key.</text>
<line x1="60" y1="883" x2="1140" y2="883" stroke="#d2dfeb" />
<text x="60" y="917" font-family="Arial, sans-serif" font-size="15" fill="#246ead" font-weight="700">SIGNATURE ON THE WIRE</text>
