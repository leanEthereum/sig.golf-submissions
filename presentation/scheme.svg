<text x="72" y="961" font-family="Arial, sans-serif" font-size="15" fill="#173d61" font-weight="700">32 B randomizer</text>
<text x="275" y="961" font-family="Arial, sans-serif" font-size="15" fill="#173d61" font-weight="700">32 B bottom proof</text>
<text x="482" y="961" font-family="Arial, sans-serif" font-size="15" fill="#173d61" font-weight="700">159 × 752 B upper proofs</text>
<text x="1140" y="960" text-anchor="end" font-family="Arial, sans-serif" font-size="18" fill="#173d61" font-weight="700">119,632 B total</text>
