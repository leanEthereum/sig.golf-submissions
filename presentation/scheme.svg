<path d="M405 319L405 287" fill="none" stroke="#2b78bd" stroke-width="5" opacity="1" stroke-linecap="round"/>
<circle cx="405" cy="281" r="15" fill="#173f70" stroke="#fff" stroke-width="2"/>
<text x="443" y="287" class="label">public key = root₁₅₉</text>
<text x="550" y="813" class="tiny">selected leaf</text>
<path d="M492 818L492 830" fill="none" stroke="#2b78bd" stroke-width="3" opacity="1" stroke-linecap="round"/>
<text x="492" y="845" class="tiny" text-anchor="middle">16 B secret preimage</text>
<rect x="748" y="203" width="392" height="653" rx="14" fill="#f9fbfd" stroke="#d0e1ee"/>
<text x="776" y="237" class="section">WHAT THE SIGNATURE CARRIES</text>
<rect x="776" y="269" width="336" height="129" rx="10" fill="#eaf4fc" stroke="#a9cde8"/>
<text x="798" y="300" class="cardhead">One bit per level</text>
<text x="798" y="329" class="body">The low 160 bits of</text>
<text x="798" y="352" class="formula">H(5, PK, message, randomizer)</text>
<text x="798" y="377" class="body">choose the left or right leaf.</text>
<path d="M776 423H1112" stroke="#d2dfeb"/>
<text x="776" y="453" class="cardhead">159 upper trees</text>
<text x="776" y="481" class="body">46 WOTS values sign the root below.</text>
<text x="776" y="507" class="body">Hash their chain endpoints to get</text>
<text x="776" y="533" class="body">the chosen leaf; add its sibling</text>
<text x="776" y="559" class="body">to obtain this tree’s root.</text>
<text x="776" y="596" class="metric">752 B per upper tree</text>
<path d="M776 618H1112" stroke="#d2dfeb"/>
<text x="776" y="648" class="cardhead">Bottom tree</text>
<text x="776" y="678" class="body">Reveal one 16 B secret preimage;</text>
<text x="776" y="704" class="body">hash it and combine the 16 B sibling.</text>
<text x="776" y="741" class="metric">32 B bottom proof</text>
<path d="M776 766H1112" stroke="#d2dfeb"/>
<text x="776" y="799" class="cardhead">Check</text>
<text x="776" y="827" class="body">The last root must equal the public key.</text>
<line x1="60" y1="883" x2="1140" y2="883" stroke="#d2dfeb"/>
<text x="60" y="917" class="section">SIGNATURE ON THE WIRE</text>
<rect x="60" y="936" width="199" height="37" rx="5" fill="#d4eafa"/>
<rect x="263" y="936" width="199" height="37" rx="5" fill="#bddbf3"/>
<rect x="466" y="936" width="522" height="37" rx="5" fill="#a6c9e9"/>
<text x="72" y="961" class="wire">32 B randomizer</text>
<text x="275" y="961" class="wire">32 B bottom proof</text>
<text x="482" y="961" class="wire">159 × 752 B upper proofs</text>
<text x="1140" y="960" class="total" text-anchor="end">119,632 B total</text>
