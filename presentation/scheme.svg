<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 885"><rect x="0" y="0" width="1200" height="885" rx="18" fill="#f9fbfe" stroke="none"/><rect x="42" y="28" width="56" height="5" rx="2" fill="#286ec4" stroke="none"/><text x="42" y="63" font-family="Arial, sans-serif" font-size="13" fill="#17549e" font-weight="700">SIG.GOLF  /  CERTIFIED EXAMPLE</text><text x="42" y="107" font-family="Arial, sans-serif" font-size="34" fill="#172b3e" font-weight="700">A 160-level stateless hypertree</text><text x="42" y="137" font-family="Arial, sans-serif" font-size="16" fill="#587089">Actual beta candidate · 128-bit hash values · 16-byte public key · no FORS</text><rect x="926" y="56" width="232" height="87" rx="10" fill="#e8f2fd" stroke="#9fbfe0"/><text x="946" y="90" font-family="Arial, sans-serif" font-size="16" fill="#17549e" font-weight="700">S = W = 119,632 B</text><text x="946" y="116" font-family="Arial, sans-serif" font-size="14" fill="#4d6880">C ≤ 5,883,520 cycles</text><text x="42" y="187" font-family="Arial, sans-serif" font-size="14" fill="#286ec4" font-weight="700">01</text><text x="78" y="187" font-family="Arial, sans-serif" font-size="16" fill="#20364b" font-weight="700">SIGNATURE LAYOUT</text><line x1="258" y1="181" x2="1158" y2="181" stroke="#d4e1ee" stroke-width="1" stroke-linecap="round"/><rect x="42" y="205" width="226" height="91" rx="9" fill="#eaf3fc" stroke="#b6d0e8"/><text x="57" y="233" font-family="Arial, sans-serif" font-size="15" fill="#17549e" font-weight="700">Randomizer</text><text x="57" y="263" font-family="Arial, sans-serif" font-size="13" fill="#375773">32 B · 0–31</text><rect x="280" y="205" width="248" height="91" rx="9" fill="#eaf3fc" stroke="#b6d0e8"/><text x="295" y="233" font-family="Arial, sans-serif" font-size="15" fill="#17549e" font-weight="700">Bottom proof</text><text x="295" y="263" font-family="Arial, sans-serif" font-size="13" fill="#375773">32 B · 32–63</text><rect x="540" y="205" width="325" height="91" rx="9" fill="#eaf3fc" stroke="#b6d0e8"/><text x="555" y="233" font-family="Arial, sans-serif" font-size="15" fill="#17549e" font-weight="700">159 upper proofs</text><text x="555" y="263" font-family="Arial, sans-serif" font-size="13" fill="#375773">159 × 752 B · 64–119,631</text><rect x="877" y="205" width="281" height="91" rx="9" fill="#eaf3fc" stroke="#b6d0e8"/><text x="892" y="233" font-family="Arial, sans-serif" font-size="15" fill="#17549e" font-weight="700">Total</text><text x="892" y="263" font-family="Arial, sans-serif" font-size="13" fill="#375773">119,632 B</text><text x="42" y="316" font-family="Arial, sans-serif" font-size="13" fill="#587089">Bottom proof = selected 16 B preimage + 16 B sibling. Each upper proof = 46 × 16 B WOTS values + 16 B sibling.</text><text x="42" y="364" font-family="Arial, sans-serif" font-size="14" fill="#286ec4" font-weight="700">02</text><text x="78" y="364" font-family="Arial, sans-serif" font-size="16" fill="#20364b" font-weight="700">SELECT THE AUTHENTICATION PATH</text><line x1="405" y1="358" x2="1158" y2="358" stroke="#d4e1ee" stroke-width="1" stroke-linecap="round"/><rect x="42" y="383" width="320" height="88" rx="12" fill="#fff" stroke="#d4e1ee"/><text x="59" y="410" font-family="Arial, sans-serif" font-size="12" fill="#17549e" font-weight="700">PUBLIC INPUTS</text><text x="59" y="438" font-family="Arial, sans-serif" font-size="15" fill="#20364b">message M · public key PK · randomizer R</text><rect x="440" y="383" width="329" height="88" rx="12" fill="#fff" stroke="#d4e1ee"/><text x="457" y="410" font-family="Arial, sans-serif" font-size="12" fill="#17549e" font-weight="700">HASH AND SELECT</text><text x="457" y="438" font-family="Arial, sans-serif" font-size="15" fill="#20364b">low 160 bits of H(5, PK, M, R)</text><rect x="847" y="383" width="311" height="88" rx="12" fill="#fff" stroke="#d4e1ee"/><text x="864" y="410" font-family="Arial, sans-serif" font-size="12" fill="#17549e" font-weight="700">160 ADDRESS BITS</text><text x="864" y="438" font-family="Arial, sans-serif" font-size="15" fill="#20364b">one left/right choice per level</text><line x1="362" y1="426" x2="431" y2="426" stroke="#286ec4" stroke-width="3" stroke-linecap="round"/><line x1="769" y1="426" x2="838" y2="426" stroke="#286ec4" stroke-width="3" stroke-linecap="round"/><text x="42" y="518" font-family="Arial, sans-serif" font-size="14" fill="#286ec4" font-weight="700">03</text><text x="78" y="518" font-family="Arial, sans-serif" font-size="16" fill="#20364b" font-weight="700">VERIFY FROM THE BOTTOM UP</text><line x1="405" y1="512" x2="1158" y2="512" stroke="#d4e1ee" stroke-width="1" stroke-linecap="round"/><rect x="42" y="541" width="348" height="238" rx="12" fill="#f2f8fe" stroke="#d4e1ee"/><text x="58" y="570" font-family="Arial, sans-serif" font-size="14" fill="#17549e" font-weight="700">LEVEL 0  ·  TWO PREIMAGE LEAVES</text><text x="58" y="594" font-family="Arial, sans-serif" font-size="12" fill="#587089">Selected preimage and sibling travel in signature</text><line x1="178" y1="637" x2="131" y2="686" stroke="#286ec4" stroke-width="4" stroke-linecap="round"/><line x1="178" y1="637" x2="225" y2="686" stroke="#d59631" stroke-width="3" stroke-linecap="round"/><circle cx="178" cy="637" r="11" fill="#286ec4" stroke="#286ec4" stroke-width="2"/><circle cx="131" cy="686" r="10" fill="#286ec4" stroke="#286ec4" stroke-width="2"/><circle cx="225" cy="686" r="10" fill="#fff0d8" stroke="#d59631" stroke-width="2"/><text x="58" y="727" font-family="Arial, sans-serif" font-size="13" fill="#20364b">hash preimage → chosen leaf</text><text x="58" y="749" font-family="Arial, sans-serif" font-size="13" fill="#20364b">hash chosen leaf + sibling → root₀</text><rect x="411" y="541" width="397" height="238" rx="12" fill="#f2f8fe" stroke="#d4e1ee"/><text x="428" y="570" font-family="Arial, sans-serif" font-size="14" fill="#17549e" font-weight="700">LEVELS 1–159  ·  REPEATED 159 TIMES</text><text x="428" y="594" font-family="Arial, sans-serif" font-size="12" fill="#587089">Each level authenticates the previous root</text><rect x="430" y="611" width="157" height="49" rx="6" fill="#fff" stroke="#b6d0e8"/><text x="443" y="640" font-family="Arial, sans-serif" font-size="13" fill="#20364b" font-weight="700">43 base-8 digits</text><rect x="604" y="611" width="185" height="49" rx="6" fill="#fff" stroke="#b6d0e8"/><text x="617" y="640" font-family="Arial, sans-serif" font-size="13" fill="#20364b" font-weight="700">3 checksum digits</text><text x="430" y="684" font-family="Arial, sans-serif" font-size="13" fill="#20364b">46 WOTS chains · 7 steps each</text><line x1="548" y1="701" x2="548" y2="728" stroke="#286ec4" stroke-width="4" stroke-linecap="round"/><line x1="548" y1="728" x2="623" y2="756" stroke="#286ec4" stroke-width="4" stroke-linecap="round"/><line x1="698" y1="728" x2="623" y2="756" stroke="#d59631" stroke-width="3" stroke-linecap="round"/><circle cx="548" cy="728" r="8" fill="#286ec4" stroke="#286ec4" stroke-width="2"/><circle cx="698" cy="728" r="8" fill="#fff0d8" stroke="#d59631" stroke-width="2"/><circle cx="623" cy="756" r="9" fill="#286ec4" stroke="#286ec4" stroke-width="2"/><rect x="829" y="541" width="329" height="238" rx="12" fill="#f2f8fe" stroke="#d4e1ee"/><text x="846" y="570" font-family="Arial, sans-serif" font-size="14" fill="#17549e" font-weight="700">PUBLIC-KEY CHECK</text><text x="846" y="603" font-family="Arial, sans-serif" font-size="13" fill="#587089">At each upper level:</text><text x="846" y="629" font-family="Arial, sans-serif" font-size="13" fill="#20364b">finish 46 chains to their endpoints</text><text x="846" y="653" font-family="Arial, sans-serif" font-size="13" fill="#20364b">hash endpoints into the selected leaf</text><text x="846" y="677" font-family="Arial, sans-serif" font-size="13" fill="#20364b">hash leaf with 16 B sibling</text><line x1="927" y1="701" x2="927" y2="728" stroke="#286ec4" stroke-width="3" stroke-linecap="round"/><rect x="846" y="730" width="294" height="36" rx="6" fill="#e6f1fc" stroke="#9fbfe0"/><text x="862" y="753" font-family="Arial, sans-serif" font-size="14" fill="#17549e" font-weight="700">final root = public key?</text><text x="42" y="818" font-family="Arial, sans-serif" font-size="13" fill="#17549e" font-weight="700">EXPAND</text><text x="121" y="818" font-family="Arial, sans-serif" font-size="14" fill="#20364b">copies the signature to the witness unchanged · 119,632 B</text><line x1="42" y1="835" x2="1158" y2="835" stroke="#d4e1ee" stroke-width="1" stroke-linecap="round"/><circle cx="52" cy="858" r="5" fill="#286ec4" stroke="#286ec4" stroke-width="2"/><text x="65" y="863" font-family="Arial, sans-serif" font-size="12" fill="#587089">selected path</text><circle cx="191" cy="858" r="5" fill="#fff0d8" stroke="#d59631" stroke-width="2"/><text x="204" y="863" font-family="Arial, sans-serif" font-size="12" fill="#587089">sibling in signature</text><text x="739" y="863" font-family="Arial, sans-serif" font-size="12" fill="#587089">Real candidate; schematic repetition, exact sizes and counts.</text></svg>
