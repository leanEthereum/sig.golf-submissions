<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1030" role="img" aria-labelledby="title desc">
<title id="title">Selected path through the 160-level binary hypertree</title>
<desc id="desc">A tower of binary Merkle trees. The bottom tree authenticates a 16-byte secret preimage. Each of 159 upper trees authenticates the previous root with a 46-chain WOTS signature. Blue branches show the selected path; amber leaves are siblings supplied in the signature. The top root is the public key.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f7fafc"/><stop offset="1" stop-color="#eef5fb"/></linearGradient>
  <linearGradient id="path" x2="1" y2="1"><stop stop-color="#59c7ef"/><stop offset="1" stop-color="#1d65b4"/></linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#2c75bc"/></marker>
</defs>
<rect width="1200" height="1030" rx="20" fill="url(#bg)"/>
<rect x="30" y="30" width="1140" height="970" rx="18" fill="#fff" stroke="#cadbea" stroke-width="2"/>
<path d="M59 74h45" stroke="#2777be" stroke-width="5" stroke-linecap="round"/>
<text x="60" y="120" class="title">One signature, one path through 160 trees</text>
<text x="60" y="153" class="subtitle">A stateless binary hypertree · selected branches in blue · supplied siblings in amber</text>
<line x1="60" y1="178" x2="1140" y2="178" stroke="#d2dfeb"/>
<rect x="60" y="203" width="660" height="653" rx="14" fill="#f5f9fd" stroke="#d0e1ee"/>
<text x="85" y="237" class="section">AUTHENTICATION PATH</text>
<text x="85" y="260" class="hint">Read upward: dashed WOTS links sign a root into the tree above.</text>

